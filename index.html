<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Video feed</title>
<style>
:root{--bg:#f1f1f4;--fg:#16161c;--mut:#6a6a78;--card:#fff;--btn:#e3e3ea;--line:#dadae2;--acc:#ff3b5c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0c11;--fg:#f4f4f8;--mut:#9b9bab;--card:#18181f;--btn:#26262f;--line:#2d2d38}}
:root[data-theme="dark"]{--bg:#0c0c11;--fg:#f4f4f8;--mut:#9b9bab;--card:#18181f;--btn:#26262f;--line:#2d2d38}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden}
button{font-family:inherit;color:inherit}
header{position:absolute;top:0;left:0;right:0;z-index:6;height:52px;padding:0 16px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.logo{font-weight:800;font-size:19px;letter-spacing:-.02em}
.add{pointer-events:auto;background:var(--btn);border-radius:20px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer}
.row{flex:1;min-height:0;display:flex}
.stage{flex:1;min-width:0;position:relative}
#feed{position:absolute;inset:0;container-type:size;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain}
#side{flex:none;width:0;overflow:hidden;transition:width .25s}
#side.open{width:381px;border-left:1px solid var(--line)}
#side .panel{width:380px;max-width:none;max-height:none;height:100%;border-radius:0}
#feed::-webkit-scrollbar{display:none}
.slide{position:relative;height:100%;box-sizing:border-box;padding:8px 0;scroll-snap-align:start;scroll-snap-stop:always;display:flex;justify-content:center;align-items:center;gap:16px}
.player{position:relative;aspect-ratio:var(--ar,.5625);width:min(calc(100cqw - 170px),calc((100cqh - 16px)*var(--ar,.5625)));background:#000;border-radius:16px;overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent}
.media{width:100%;height:100%;object-fit:contain;display:block}
.info{position:absolute;left:0;right:0;bottom:0;padding:56px 16px 18px;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff;pointer-events:none}
.info b{display:block;font-size:16px}
.info span{display:block;margin-top:2px;font-size:14px;opacity:.92}
.track{position:absolute;left:0;right:0;bottom:0;height:18px;z-index:2;cursor:pointer;background:linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,.28)) bottom/100% 3px no-repeat;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.bar{position:absolute;left:0;bottom:0;height:3px;width:0;background:#fff;pointer-events:none;transition:height .15s}
.track:hover .bar{height:6px}
.track.hold{background-size:100% 8px}
.track.hold .bar{height:8px}
.track.hold .bar::after{content:"";position:absolute;right:-8px;bottom:-4px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.5);animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.pv{position:absolute;bottom:32px;z-index:3;background:#000;border:2px solid #fff;border-radius:10px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.5);pointer-events:none;opacity:0;transform:translateX(-50%) translateY(10px) scale(.85);transform-origin:bottom center;transition:opacity .18s,transform .18s}
.pv.on{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
.pv span{display:block;padding:3px 0;text-align:center;font-size:12px;font-weight:600;color:#fff;background:rgba(0,0,0,.7)}
.pp{position:absolute;inset:0;margin:auto;width:72px;height:72px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;display:none;place-items:center;pointer-events:none}
.paused .pp{display:grid}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pp .ic{width:34px;height:34px}
.actions{--abtn:var(--btn);--afg:var(--fg);display:flex;flex-direction:column;align-items:center;gap:14px;align-self:flex-end;padding-bottom:16px}
.act{background:none;border:0;padding:0;color:var(--afg);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;cursor:pointer}
.act i{width:48px;height:48px;border-radius:50%;background:var(--abtn);display:grid;place-items:center;transition:transform .15s}
.act:active i{transform:scale(.9)}
.act.like.on .ic{fill:var(--acc);stroke:var(--acc)}
.act.save.on .ic{fill:#f5b301;stroke:#f5b301}
.act.flag.on .ic{fill:#ff8a00;stroke:#ff8a00}
.nav{position:absolute;right:16px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px;z-index:5}
.nav button{width:48px;height:48px;border-radius:50%;border:0;background:var(--btn);display:grid;place-items:center;cursor:pointer}
.nav button:disabled{opacity:.35;cursor:default}
button:focus-visible,input:focus-visible,.add:focus-within{outline:2px solid var(--acc);outline-offset:2px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;justify-content:center;align-items:center;z-index:10}
.sheet[hidden]{display:none}
.panel{background:var(--card);width:min(480px,100%);max-height:80%;display:flex;flex-direction:column;border-radius:16px;overflow:hidden}
.ph{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:700}
.ph button{background:none;border:0;font-size:22px;line-height:1;cursor:pointer;color:var(--mut)}
.pb{flex:1;overflow:auto;padding:8px 16px}
.cm{padding:8px 0}.cm b{margin-right:6px}
.empty{color:var(--mut);padding:16px 0}
.pf{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.pf[hidden]{display:none}
.pf input{flex:1;min-width:0;padding:10px 14px;border-radius:20px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit}
.pf button{border:0;border-radius:20px;padding:0 16px;background:var(--acc);color:#fff;font-weight:600;cursor:pointer}
.reason{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 0;font-size:15px;cursor:pointer}
.cm img{display:block;max-width:100%;max-height:240px;border-radius:10px;margin-top:6px}
.lk{display:block;margin-top:8px;border:1px solid var(--line);border-radius:10px;overflow:hidden;text-decoration:none;color:inherit}
.lk canvas{width:100%;display:block}
.lk div{padding:8px 10px;font-size:13px}
.lk b{margin:0;display:block}
.lk span{display:block;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf .att{background:var(--btn);color:var(--fg);padding:0 12px;font-size:18px}
.thumb{flex:1 0 100%;display:flex;align-items:center;gap:10px}
.thumb[hidden]{display:none}
.thumb img{height:56px;border-radius:8px}
.thumb button{padding:6px 12px!important;font-size:13px}
.menu{position:fixed;z-index:30;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:6px;min-width:160px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.menu button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:10px 12px;border-radius:8px;font-size:15px;text-align:left;cursor:pointer}
.menu button:hover{background:var(--btn)}
.menu .ic{width:20px;height:20px}
.snd{position:absolute;left:16px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:12px;z-index:5}
.snd button{width:48px;height:48px;border-radius:50%;border:0;background:var(--btn);display:grid;place-items:center;cursor:pointer}
.snd input{writing-mode:vertical-lr;direction:rtl;height:110px;width:24px;accent-color:var(--acc);cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;font-size:14px}
.toast.on{opacity:1}
@media (max-width:760px),(orientation:portrait){
 .slide{padding:0}
 .player{width:100%;height:100%;aspect-ratio:auto;border-radius:0}
 .info{padding-right:84px}
 .actions{--abtn:rgba(0,0,0,.42);--afg:#fff;position:absolute;right:10px;bottom:64px;padding:0;z-index:2;text-shadow:0 1px 3px rgba(0,0,0,.6)}
 .nav,#side{display:none}
 header{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
 .add{background:rgba(0,0,0,.42);text-shadow:none}
 .snd{left:auto;right:10px;top:60px;transform:none}
 .snd button{background:rgba(0,0,0,.42);color:#fff}
 .snd input{display:none}
 .sheet{align-items:flex-end}
 .panel{border-radius:16px 16px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 21s-8-5.3-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.7-8 11-8 11z"/></symbol>
<symbol id="i-msg" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-5.4A8 8 0 1 1 21 12z"/></symbol>
<symbol id="i-bm" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></symbol>
<symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4M5 4h12l-2 4 2 4H5"/></symbol>
<symbol id="i-up" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
<symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor" stroke="none"/></symbol>
<symbol id="i-vol" viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></symbol>
<symbol id="i-mute" viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M16 9l5 6M21 9l-5 6"/></symbol>
<symbol id="i-dots" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></symbol>
<symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></symbol>
</defs></svg>

<div class="row"><div class="stage"><header>
 <div class="logo">Feed</div>
 <label class="add">Add a video<input id="up" type="file" accept="video/*" hidden></label>
</header>
<main id="feed"></main>
<div class="nav">
 <button id="prev" aria-label="Previous video"><svg class="ic"><use href="#i-up"/></svg></button>
 <button id="next" aria-label="Next video"><svg class="ic"><use href="#i-down"/></svg></button>
</div>
<div class="snd"><button id="mute" aria-label="Turn sound on"><svg class="ic"><use href="#i-mute"/></svg></button><input id="vol" type="range" min="0" max="1" step=".01" value="0" aria-label="Volume"></div></div><aside id="side"></aside></div>
<div class="sheet" id="sheet" hidden>
 <div class="panel" role="dialog" aria-modal="true">
  <div class="ph"><span id="pt"></span><button id="x" aria-label="Close">×</button></div>
  <div class="pb" id="pb"></div>
  <div class="pf" id="pf" hidden></div>
 </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const V=[
{id:"a",user:"@light",cap:"Evening light orbs ✨ #vibes",hue:280,mode:0,likes:12430,cm:[["marie","Gorgeous, those colors!"],["tom","Hypnotic 😍"]]},
{id:"b",user:"@waves",cap:"Looping waves to unwind 🌊",hue:200,mode:1,likes:8921,cm:[["lea","I could watch this for hours."]]},
{id:"c",user:"@circles",cap:"Concentric circles #motion",hue:340,mode:2,r:1,likes:530,cm:[["sam","Nice look"]]},
{id:"d",user:"@dawn",cap:"Dawn gradient 🌅",hue:20,mode:0,likes:3204,cm:[["nina","Makes me want to get up early"],["hugo","Superb"]]},
{id:"e",user:"@neon",cap:"Neon and waves #night",hue:150,mode:1,r:16/9,likes:987,cm:[]},
{id:"f",user:"@cosmos",cap:"Cosmic rings 🪐",hue:240,mode:2,likes:25100,cm:[["yan","Best of the week"]]}
];
const L={like:"Like",cmt:"Comments",save:"Save",more:"More options"},I={like:"heart",cmt:"msg",save:"bm",more:"dots"};
const $=s=>document.querySelector(s);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x)e.textContent=x;return e};
const ic=n=>`<svg class="ic"><use href="#i-${n}"/></svg>`;
const fmt=n=>n>=1000?(n/1000).toFixed(1).replace(".0","")+"K":String(n);
let S={liked:{},saved:{},flag:{},cm:{}};
try{S=Object.assign(S,JSON.parse(localStorage.getItem("fv")||"{}"))}catch(e){}
const persist=()=>{try{localStorage.setItem("fv",JSON.stringify(S))}catch(e){}};
const feed=$("#feed"),side=$("#side"),panel=$(".panel"),mob=matchMedia("(max-width:760px),(orientation:portrait)"),sh=$("#sheet"),pt=$("#pt"),pb=$("#pb"),pf=$("#pf"),prev=$("#prev"),next=$("#next");
let items=[],cur=0,tt;

function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),2400)}

function draw(c,v,t){
 const x=c.getContext("2d"),w=c.width,h=c.height,H=v.hue,g=x.createLinearGradient(0,0,0,h);
 g.addColorStop(0,`hsl(${H},70%,16%)`);g.addColorStop(1,`hsl(${H+50},75%,34%)`);
 x.fillStyle=g;x.fillRect(0,0,w,h);
 for(let k=0;k<7;k++){
  const p=t*.5+k*1.7,col=`hsla(${H+k*14},90%,68%,`;
  if(v.mode==0){x.fillStyle=col+".35)";x.beginPath();x.arc(w/2+Math.sin(p)*w*.36,h/2+Math.cos(p*.8+k)*h*.34,Math.min(w,h)*(.07+k*.016),0,7);x.fill()}
  else if(v.mode==1){x.strokeStyle=col+".6)";x.lineWidth=3;x.beginPath();for(let y=0;y<=h;y+=16){const xx=w/2+Math.sin(y/90+p)*(w*.17+k*12);y?x.lineTo(xx,y):x.moveTo(xx,y)}x.stroke()}
  else{x.strokeStyle=col+".6)";x.lineWidth=4;x.beginPath();x.arc(w/2,h/2,Math.min(w,h)*(.07+k*.06)+Math.sin(p)*14,0,7);x.stroke()}
 }
}

function render(){
 io.disconnect();feed.innerHTML="";items=[];cur=0;
 V.forEach((v,i)=>{
  const s=el("section","slide"),r=v.r||9/16,cw=r>=1?640:Math.round(640*r),ch=r>=1?Math.round(640/r):640;s.dataset.i=i;s.style.setProperty("--ar",r);
  s.innerHTML=`<div class="player">${v.src?`<video class="media" src="${v.src}" loop playsinline></video>`:`<canvas class="media" width="${cw}" height="${ch}"></canvas>`}<div class="pp">${ic("play")}</div><div class="info"><b></b><span></span></div><div class="track" aria-label="Progress bar"><div class="bar"></div></div></div><div class="actions">${["like","cmt","save","more"].map(k=>`<button class="act ${k}" data-k="${k}" aria-label="${L[k]}"><i>${ic(I[k])}</i><span></span></button>`).join("")}</div>`;
  s.querySelector(".info b").textContent=v.user;s.querySelector(".info span").textContent=v.cap;
  feed.append(s);
  const cv=s.querySelector("canvas"),vd=s.querySelector("video");if(vd)vd.onloadedmetadata=()=>s.style.setProperty("--ar",vd.videoWidth/vd.videoHeight);
  items.push({el:s,v,cv,vid:s.querySelector("video"),bar:s.querySelector(".bar"),paused:true,t:i*3});
  if(cv)draw(cv,v,i*3);
  upd(i);io.observe(s);
 });
}

function upd(i){
 const {el:s,v}=items[i],q=k=>s.querySelector("."+k),n=(S.cm[v.id]||[]).length+v.cm.length;
 q("like").classList.toggle("on",!!S.liked[v.id]);q("like span").textContent=fmt(v.likes+(S.liked[v.id]?1:0));
 q("cmt span").textContent=fmt(n);
 q("save").classList.toggle("on",!!S.saved[v.id]);q("save span").textContent=S.saved[v.id]?"Saved":"Save";
 
}

function setP(it,p){
 it.paused=p;it.el.classList.toggle("paused",p);
 if(it.vid){if(p)it.vid.pause();else{it.vid.muted=muted;it.vid.volume=vol;it.vid.play().catch(()=>{muted=true;snd();it.vid.play().catch(()=>{})})}}
 tone();
}
function go(i){
 cur=i;
 items.forEach((it,j)=>{
  if(j==i){it.t=0;if(it.vid)it.vid.currentTime=0;setP(it,false)}
  else{it.paused=true;it.el.classList.remove("paused");if(it.vid)it.vid.pause()}
 });
 prev.disabled=i==0;next.disabled=i==items.length-1;if(side.classList.contains("open"))comments(i);
}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)go(+e.target.dataset.i)}),{root:feed,threshold:.6});
let anim=0,wl=0;
const scrollTo=i=>{
 if(i<0||i>=items.length)return;
 const a=feed.scrollTop,b=i*feed.clientHeight,t0=performance.now(),D=220,id=++anim;
 feed.style.scrollSnapType="none";
 const f=t=>{if(id!==anim)return;const k=Math.min(1,(t-t0)/D);feed.scrollTop=a+(b-a)*(1-Math.pow(1-k,3));if(k<1)requestAnimationFrame(f);else feed.style.scrollSnapType=""};
 requestAnimationFrame(f);
};
feed.addEventListener("touchstart",()=>{anim++;feed.style.scrollSnapType=""},{passive:true});
feed.addEventListener("wheel",e=>{
 e.preventDefault();
 const n=performance.now(),ok=n>wl&&Math.abs(e.deltaY)>8;
 wl=Math.max(wl,n+(ok?300:150));
 if(ok)scrollTo(cur+(e.deltaY>0?1:-1));
},{passive:false});
prev.onclick=()=>scrollTo(cur-1);next.onclick=()=>scrollTo(cur+1);
addEventListener("keydown",e=>{
 if(!sh.hidden||/INPUT/.test(e.target.tagName))return;
 if(e.key=="ArrowDown"){e.preventDefault();scrollTo(cur+1)}
 if(e.key=="ArrowUp"){e.preventDefault();scrollTo(cur-1)}
});

let ac,mg,tn=[],muted=true,vol=.8;
function wake(){if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();mg.connect(ac.destination)}ac.resume();tone()}
function tone(){
 tn.forEach(o=>{try{o.stop()}catch(e){}});tn=[];
 const it=items[cur];if(!ac||!it||it.vid||it.paused)return;
 const f=110+it.v.hue/360*110;
 [1,1.5,2].forEach((m,k)=>{const o=ac.createOscillator(),g=ac.createGain();o.type="sine";o.frequency.value=f*m;g.gain.value=.08/(k+1);o.connect(g);g.connect(mg);o.start();tn.push(o)});
}
function snd(){
 items.forEach(x=>{if(x.vid){x.vid.muted=muted;x.vid.volume=vol}});
 if(mg)mg.gain.value=muted?0:vol;
 $("#mute use").setAttribute("href",muted?"#i-mute":"#i-vol");
 $("#mute").setAttribute("aria-label",muted?"Turn sound on":"Turn sound off");
 $("#vol").value=muted?0:vol;
}
$("#mute").onclick=()=>{muted=!muted;if(!muted&&vol<.05)vol=.6;if(!muted)wake();snd()};
$("#vol").oninput=e=>{vol=+e.target.value;muted=vol==0;if(!muted)wake();snd()};
function seek(i,r,x){
 const it=items[i],f=Math.max(0,Math.min(1,(x-r.left)/r.width));
 if(it.vid){if(it.vid.duration)it.vid.currentTime=f*it.vid.duration}
 else{it.t=f*12;draw(it.cv,it.v,it.t)}
 it.bar.style.width=f*100+"%";
}
const fmtT=s=>Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0");
function pvOpen(it,tr){
 const ar=it.vid?(it.vid.videoWidth?it.vid.videoWidth/it.vid.videoHeight:.5625):it.cv.width/it.cv.height;
 const h=Math.min(120,160/ar),w=h*ar,p=el("div","pv"),m=it.vid?el("video"):el("canvas");
 if(it.vid){m.src=it.vid.currentSrc||it.vid.src;m.muted=true;m.playsInline=true;m.preload="auto"}else{m.width=it.cv.width;m.height=it.cv.height}
 m.style.cssText=`width:${w}px;height:${h}px;display:block;object-fit:cover`;
 p.append(m,el("span"));it.pm=m;it.pv=p;
 it.el.querySelector(".player").append(p);
 tr.classList.add("hold");
 requestAnimationFrame(()=>p.classList.add("on"));
}
function pvClose(it,tr){
 tr.classList.remove("hold");
 const p=it.pv;it.pv=it.pm=null;if(!p)return;
 p.classList.remove("on");setTimeout(()=>p.remove(),200);
}
function scrub(it,tr,f){
 it.bar.style.width=f*100+"%";
 const d=it.vid?(it.vid.duration||0):12,tm=f*d;
 if(!it.vid){it.t=tm;draw(it.cv,it.v,tm)}
 const p=it.pv;if(!p)return;
 const pr=it.el.querySelector(".player").getBoundingClientRect(),r=tr.getBoundingClientRect(),half=p.offsetWidth/2;
 p.style.left=Math.max(half+8,Math.min(pr.width-half-8,r.left-pr.left+f*r.width))+"px";
 p.lastChild.textContent=fmtT(tm);
 if(it.vid){const m=it.pm;if(m.readyState>0)m.currentTime=tm;else m.onloadedmetadata=()=>{m.currentTime=tm}}else draw(it.pm,it.v,tm);
}
feed.addEventListener("pointerdown",e=>{
 const tr=e.target.closest(".track");if(!tr)return;
 const i=+tr.closest(".slide").dataset.i,it=items[i];
 let on=false,x=e.clientX;
 const pos=()=>{const r=tr.getBoundingClientRect();return Math.max(0,Math.min(1,(x-r.left)/r.width))};
 const mv=ev=>{x=ev.clientX;if(on)scrub(it,tr,pos())};
 const tm=setTimeout(()=>{on=true;it.scrub=true;if(it.vid)it.vid.pause();pvOpen(it,tr);scrub(it,tr,pos())},350);
 const end=()=>{
  clearTimeout(tm);removeEventListener("pointermove",mv);removeEventListener("pointerup",end);removeEventListener("pointercancel",end);
  if(!on)return;
  seek(i,tr.getBoundingClientRect(),x);pvClose(it,tr);it.scrub=false;
  if(it.vid&&!it.paused)it.vid.play().catch(()=>{});
 };
 addEventListener("pointermove",mv);addEventListener("pointerup",end);addEventListener("pointercancel",end);
});
feed.addEventListener("contextmenu",e=>{if(e.target.closest(".track"))e.preventDefault()});
let last=0;
function tick(ts){
 requestAnimationFrame(tick);
 const dt=Math.min((ts-last)/1000,.1);last=ts;
 const it=items[cur];if(!it)return;
 if(it.vid){if(it.vid.duration&&!it.scrub)it.bar.style.width=it.vid.currentTime/it.vid.duration*100+"%";return}
 if(it.paused||it.scrub)return;
 it.t+=dt;draw(it.cv,it.v,it.t);it.bar.style.width=(it.t%12)/12*100+"%";
}

function like(i,on){const id=V[i].id;S.liked[id]=on?true:!S.liked[id];persist();upd(i)}
function close(){sh.hidden=true;side.classList.remove("open")}
let mn;
function closeMenu(){if(mn){mn.remove();mn=null}}
document.addEventListener("pointerdown",e=>{if(mn&&!mn.contains(e.target)&&!e.target.closest(".more"))closeMenu()});
feed.addEventListener("scroll",closeMenu,{passive:true});
function menu(i,b){
 if(mn&&mn.dataset.i==i){closeMenu();return}
 closeMenu();
 const r=b.getBoundingClientRect();mn=el("div","menu");mn.dataset.i=i;
 [["share","Share",share],["flag","Report",report]].forEach(([k,t,fn])=>{const m=el("button","",t);m.insertAdjacentHTML("afterbegin",ic(k));m.onclick=()=>{closeMenu();fn(i)};mn.append(m)});
 document.body.append(mn);
 mn.style.right=innerWidth-r.left+8+"px";mn.style.top=Math.max(8,Math.min(r.top,innerHeight-mn.offsetHeight-8))+"px";
}
async function share(i){
 const v=V[i],d={title:"Video feed",text:v.user+" – "+v.cap,url:location.href};
 try{if(navigator.share){await navigator.share(d);return}}catch(e){if(e.name=="AbortError")return}
 try{await navigator.clipboard.writeText(d.url);toast("Link copied");return}catch(e){}
 const inp=el("input");inp.readOnly=true;inp.value=d.url;inp.style.cssText="width:100%;box-sizing:border-box;padding:10px;margin:12px 0;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit";
 pt.textContent="Share";pf.hidden=true;pb.replaceChildren(inp);sh.append(panel);side.classList.remove("open");sh.hidden=false;inp.select();
}
mob.onchange=close;
function shrink(f){return new Promise(res=>{const im=new Image(),rd=new FileReader();im.onload=()=>{const k=Math.min(1,800/Math.max(im.width,im.height)),c=el("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.8))};im.onerror=()=>res(null);rd.onload=()=>{im.src=rd.result};rd.onerror=()=>res(null);rd.readAsDataURL(f)})}
function linkCard(u){
 let o;try{o=new URL(u)}catch(e){return el("span")}
 if(!/^https?:$/.test(o.protocol))return el("span");
 const d=o.hostname.replace(/^www\./,""),a=el("a","lk");a.href=o.href;a.target="_blank";a.rel="noopener noreferrer nofollow";
 let h=0;for(const ch of d)h=(h*31+ch.charCodeAt(0))%360;
 const c=el("canvas");c.width=480;c.height=252;
 const x=c.getContext("2d"),g=x.createLinearGradient(0,0,480,252);
 g.addColorStop(0,`hsl(${h},65%,40%)`);g.addColorStop(1,`hsl(${h+60},70%,22%)`);x.fillStyle=g;x.fillRect(0,0,480,252);
 x.fillStyle="rgba(255,255,255,.16)";x.beginPath();x.arc(410,50,120,0,7);x.fill();
 x.fillStyle="#fff";x.font="700 130px system-ui,sans-serif";x.fillText(d[0].toUpperCase(),32,160);
 x.font="600 28px system-ui,sans-serif";x.fillText(d.slice(0,30),32,215);
 const t=el("div");t.append(el("b","",d),el("span","",decodeURI(o.pathname+o.search).slice(0,80)||"/"));
 a.append(c,t);return a;
}
function comments(i){
 const v=V[i],list=()=>v.cm.concat(S.cm[v.id]||[]);
 const inp=el("input");inp.placeholder="Add a comment…";inp.maxLength=300;inp.setAttribute("aria-label","Your comment");
 const btn=el("button","","Post"),att=el("button","att","📎"),fi=el("input"),th=el("div","thumb");let img=null;
 fi.type="file";fi.accept="image/*";fi.hidden=true;th.hidden=true;att.title="Attach an image";att.setAttribute("aria-label","Attach an image");
 att.onclick=()=>fi.click();
 fi.onchange=async()=>{const f=fi.files[0];fi.value="";if(!f)return;img=await shrink(f);if(!img)return toast("Couldn’t read that image.");const rm=el("button","","Remove");rm.onclick=()=>{img=null;th.hidden=true};th.replaceChildren(Object.assign(el("img"),{src:img,alt:""}),rm);th.hidden=false};
 const show=()=>{
  const l=list();pt.textContent=l.length+(l.length==1?" comment":" comments");
  pb.replaceChildren(...(l.length?l.map(c=>{c=Array.isArray(c)?{u:c[0],t:c[1]}:c;const d=el("div","cm");d.append(el("b","","@"+c.u),el("span","",c.t));if(c.img)d.append(Object.assign(el("img"),{src:c.img,alt:"Attached image"}));(c.t.match(/https?:\/\/[^\s]+/g)||[]).slice(0,2).forEach(u=>d.append(linkCard(u)));return d}):[el("div","empty","No comments yet. Start the conversation.")]));
  pb.scrollTop=1e9;upd(i);
 };
 const send=()=>{const t=inp.value.trim();if(!t&&!img)return;(S.cm[v.id]=S.cm[v.id]||[]).push({u:"me",t,img});inp.value="";img=null;th.hidden=true;persist();show()};
 btn.onclick=send;inp.onkeydown=e=>{if(e.key=="Enter")send()};
 pf.replaceChildren(th,att,fi,inp,btn);pf.hidden=false;show();
 if(mob.matches){sh.append(panel);side.classList.remove("open");sh.hidden=false}else{side.append(panel);sh.hidden=true;side.classList.add("open")}
}
function report(i){
 const v=V[i];
 if(S.flag[v.id]){toast("You already reported this video.");return}
 pt.textContent="Report this video";pf.hidden=true;
 pb.replaceChildren(...["Inappropriate content","Harassment or hate","Spam or scam","Violence","Misinformation","Other"].map(r=>{
  const b=el("button","reason",r);
  b.onclick=()=>{S.flag[v.id]=r;persist();close();upd(i);toast("Thanks, your report has been sent.")};
  return b;
 }));
 sh.append(panel);side.classList.remove("open");sh.hidden=false;
}

feed.addEventListener("click",e=>{
 const s=e.target.closest(".slide");if(!s)return;
 const i=+s.dataset.i,a=e.target.closest(".act"),tr=e.target.closest(".track");
 if(tr){seek(i,tr.getBoundingClientRect(),e.clientX);return}
 if(a){
  const k=a.dataset.k,id=V[i].id;
  if(k=="like")like(i);
  else if(k=="save"){S.saved[id]=!S.saved[id];persist();upd(i);toast(S.saved[id]?"Video saved":"Removed from saved")}
  else if(k=="cmt")comments(i);
  else menu(i,a);
 }else if(e.target.closest(".player"))setP(items[i],!items[i].paused);
});
feed.addEventListener("dblclick",e=>{const p=e.target.closest(".player");if(p&&!e.target.closest(".track"))like(+p.parentNode.dataset.i,true)});
sh.addEventListener("click",e=>{if(e.target===sh)close()});
$("#x").onclick=close;
addEventListener("keydown",e=>{if(e.key=="Escape"){close();closeMenu()}});

$("#up").onchange=e=>{
 const f=e.target.files[0];if(!f)return;
 V.unshift({id:"u"+Date.now(),user:"@me",cap:f.name,src:URL.createObjectURL(f),likes:0,cm:[]});
 render();feed.scrollTo(0,0);e.target.value="";
 toast("Video added (only visible to you during this session).");
};

snd();render();requestAnimationFrame(tick);
</script>
</body>
</html>
